	Ce squelette definit les styles de l'espace prive

	Note: l'entete "Vary:" sert a repousser l'entete par
	defaut "Vary: Cookie,Accept-Encoding", qui est (un peu)
	genant en cas de "rotation du cookie de session" apres
	un changement d'IP (effet de clignotement).

	ATTENTION: il faut absolument le charset sinon Firefox croit que
	c'est du text/html !]

#CACHE{3600*100,cache-client}
#HTTP_HEADER{Content-Type: text/css; charset=utf-8}
#HTTP_HEADER{Vary: Accept-Encoding}

#SET{claire,##ENV{couleur_claire,edf3fe}}
#SET{foncee,##ENV{couleur_foncee,3874b0}}
#SET{left,#ENV{ltr}|choixsiegal{left,left,right}}
#SET{right,#ENV{ltr}|choixsiegal{left,right,left}}

.formulaire_editer_article_accueil .article_accueil-entete {
	padding-#LEFT: calc(24px + (var(--spip-form-spacing-x, 10px) / 2));
	background: url(#CHEMIN_IMAGE{article_accueil-24.png}) no-repeat;
	background-size: 24px auto;
	background-position: bottom var(--spip-left,#LEFT);
	/* min-height: 24px; */
	padding-top: var(--spip-form-spacing-y,10px);
	display: flex;
}
.formulaire_editer_article_accueil .article_accueil-titre {
	padding: var(--spip-form-spacing-y,10px) 0;
}
.formulaire_editer_article_accueil .article_accueil-titre div.liste-objets.article-accueil {
	margin-top: 0;
	margin-bottom: 0px;
	border-top: 0;
	background-color:white;
	position:static
}
.formulaire_editer_article_accueil .article_accueil-form {
	margin-bottom: 0px;
}
