<h1>Plan du site</h1>
<h3>Cliquez sur un dossier pour voir son contenu.</h3>
<h3>Cliquez sur un titre pour l'afficher</h3>
<br />


<!-- début du script du plan sous forme de dossiers et fichiers type Windows -->
<script type="text/javascript">
if (document.getElementById) {
	var rub0 = new WebFXTree(' Accueil [(#NOM_SITE_SPIP)]', "#URL_SITE_SPIP/");
	rub0.setBehavior('classic');
	
    <BOUCLE_secteur(RUBRIQUES) {id_parent=0} {par titre}>
	  var rub#ID_RUBRIQUE = new WebFXTreeItem(' [(#TITRE|texte_script|couper{70})]',"#URL_RUBRIQUE");
	  rub0.add(rub#ID_RUBRIQUE);
	  
	  <BOUCLE_art1(ARTICLES) {id_rubrique}{par date}>
	     rub#ID_RUBRIQUE.add(new WebFXTreeItem(' [(#TITRE|texte_script|couper{70})] (article)',"#URL_ARTICLE"));
	  </BOUCLE_art1>

	  <BOUCLE_blogs(BREVES) {titre_mot=blog} {id_rubrique}{par date} {doublons}>
	     rub#ID_RUBRIQUE.add(new WebFXTreeItem(' [(#TITRE|texte_script|couper{70})] (blog [(#DATE|jour)]/[(#DATE|mois)]/[(#DATE|annee)])',"#URL_BREVE"));
	  </BOUCLE_blogs>

	  <BOUCLE_br(BREVES) {id_rubrique}{par date} {doublons}>
	     rub#ID_RUBRIQUE.add(new WebFXTreeItem(' [(#TITRE|texte_script|couper{70})] (br&egrave;ve [(#DATE|jour)]/[(#DATE|mois)]/[(#DATE|annee)])',"#URL_BREVE"));
	  </BOUCLE_br>
		  
	  <?php
	  $id = 0   //rubrique = secteur
	  ?>
	  
	  <B_rub>
	  
	    <?php 
	    $ancien_id = $id;  //sauvegarde de la rubrique en cours
	    $id = #ID_RUBRIQUE;
	    ?>

	  <?php $id = #ID_RUBRIQUE; ?>
	  
	  <BOUCLE_rub(RUBRIQUES){id_parent}{par titre}>
	     var rub#ID_RUBRIQUE = new WebFXTreeItem(' [(#TITRE|texte_script|couper{70})]',"#URL_RUBRIQUE");
		 rub#ID_PARENT.add(rub#ID_RUBRIQUE);
		 
		 <BOUCLE_art2(ARTICLES){id_rubrique}{par date}>
		   rub#ID_RUBRIQUE.add(new WebFXTreeItem(' [(#TITRE|texte_script|couper{70})] (article)',"#URL_ARTICLE"));
	     </BOUCLE_art2>
	     
         <BOUCLE_recursive(BOUCLE_rub)></BOUCLE_recursive>
	 
	  </BOUCLE_rub>

	  <?php 
	  $id = $ancien_id;   //restauration de la rubrique en cours
	  ?>


  	  </B_rub>
	  
	</BOUCLE_secteur>

	document.write(rub0);
}
</script>
<!-- fin du script du plan sous forme de dossiers et fichiers type Windows -->
