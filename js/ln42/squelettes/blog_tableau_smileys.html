$listimag=array();
$rep1="Images/smileys/";
$listfich=opendir($rep1);
while ($fich=readdir($listfich))
{	if(($fich !='..') and ($fich !='.') and ($fich !='.test') and (!is_dir($rep1 . $fich)) )
	{

$listimag[$nomfich]=$rep1.$fich;
	}
}


ksort($listimag);
reset($listimag);
$compte=0;

// changer ci-dessous le nombre de colonnes (3 par d&#xe9;faut) //////////
$nbcol=3;

echo "<div class=\"smileys\">\n";
while (list($nom,$chem) = each($listimag))
{ 
echo "
<div class=\"icone\">
<a href=\"javascript:emoticon(':".$nom."')\">
	<img src=\"".$chem."\" alt=\":".$nom."\" title=\":".$nom."\">
</a>
</div>\n";

$compte++; 
	if ($compte % $nbcol == 0)
	{
	echo"<hr/> <!-- permet &#xe9;ventuellement d'imposer un passage &#xe0; la ligne -->";}
	}

echo "</div>";
